name: Tests

# Trigger notes:
# - In branch filters, "*" does NOT match "/", so the previous push filter
#   ["*"] silently matched only single-segment names (in practice: main) and
#   never any feat/... working branch.
# - pull_request filters on the PR's BASE branch; restricting it to main meant
#   stacked PRs (base = another feature branch) ran no checks at all.
# Fix: run on every PR regardless of base, and keep push runs for main only
# (a PR branch is covered by its pull_request run; push would duplicate it).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Allow manual triggering

# Least-privilege token: these jobs only read the repo to run tests. Declared
# explicitly (matching security-scan.yaml) so the workflow does not inherit a
# wider default GITHUB_TOKEN scope if the repo/org default changes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv tool install tox --with tox-uv

      - name: Run tox
        run: tox
        timeout-minutes: 3

  notebooks:
    # Demo marimo notebooks are slow to execute end-to-end, so they run as a
    # separate tox env (not part of the default `tox` above) to keep the main
    # matrix fast. Run across every supported Python version like `test`.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv tool install tox --with tox-uv

      - name: Run notebook tests
        run: tox -e notebooks
        timeout-minutes: 5
